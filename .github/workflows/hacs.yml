name: HACS Action

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 每天 UTC 00:00 跑一次，防止上游改动悄悄弄坏校验
    - cron: "0 0 * * *"

permissions: {}

jobs:
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
